<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryFast Ecosystem SPA</title>
</head>
<body>

<div id="app"></div>

<!-- Entire Stack: Core + Rooting + FX -->
<script src="./dist/queryfast.min.js"></script>
<script src="./dist/rootingfast.min.js"></script>
<script src="./dist/fx.min.js"></script>

<script>
    const { Q, RootingFast, FX } = window;

    // --- 1. Global Setup ---
    Q.global(`
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8f9fa; color: #1a1a1a; overflow-x: hidden;
        }
        .nav-bar { background: #fff; border-bottom: 1px solid #ddd; padding: 20px 40px; display: flex; gap: 20px; }
        .nav-bar a { text-decoration: none; color: #666; font-weight: 700; cursor: pointer; }
        .nav-bar a:hover { color: #0070f3; }
        .page { padding: 40px; max-width: 800px; margin: 0 auto; }
    `);

    // --- 2. Components ---

    function Layout(parent, contentFn, ...args) {
        const root = parent.el("div");
        const nav = root.el("div.nav-bar");
        nav.el("a").attr("href", "/").text("HOME");
        nav.el("a").attr("href", "/dashboard").text("DASHBOARD");

        const page = root.el("div.page");
        contentFn(page, ...args);
    }

    // --- 3. Pages ---

    async function HomePage(ctx, scp) {
        const app = Q("#app");
        app[0].innerHTML = "";
        
        app.el(Layout, (page) => {
            const h = page.el("h1").text("RootingFast Backbone");
            page.el("p").text("This page was routed with RootingFast. No magic, just explicit Page functions.");
            
            // FX Entry
            FX.motion.slideIn(h, { y: 30 });
        });
    }

    async function DashboardPage(ctx, scp) {
        const app = Q("#app");
        app[0].innerHTML = "";

        app.el(Layout, (page) => {
            page.el("h1").text("Atomic Dashboard");
            
            const stats = page.el("div").ui({ display: "flex", gap: "10px", marginTop: "20px" });
            
            // Atomic State sharing through 'scp'
            if (!scp.visits) scp.visits = Q.state(0);
            scp.visits.value++;

            stats.el("div").ui({ background: "#fff", padding: "20px", borderRadius: "12px", border: "1px solid #ddd" })
                .el("spn").bind(scp.visits, v => v, 'text').ui({ fontSize: "2rem", fontWeight: "800", display: "block" })
                .parent.el("spn").text("Visits this session").ui({ fontSize: "0.8rem", opacity: "0.5" });

            page.el("btn").text("Manual Reset")
                .ui({ marginTop: "20px", padding: "10px 20px", background: "#0070f3", color: "#fff", border: "none", borderRadius: "8px", cursor: "pointer" })
                .on("click", () => scp.visits.value = 0);
        });
    }

    // --- 4. Initialize Router ---
    RootingFast.route({
        "/": HomePage,
        "/dashboard": DashboardPage
    });

</script>
</body>
</html>

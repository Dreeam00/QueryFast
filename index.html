<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryFast v2.0 Demo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px; background: #f4f7f6; }
        .hero { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
        .title { font-size: 2.5rem; margin: 0 0 10px; color: #333; }
        .sub { font-size: 1.1rem; color: #666; margin-bottom: 30px; }
        .counter-box { display: flex; align-items: center; gap: 20px; padding: 20px; background: #eee; border-radius: 8px; }
        .count-val { font-size: 1.5rem; font-weight: bold; min-width: 40px; text-align: center; }
        .btn-inc { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: transform 0.1s; }
        .btn-inc:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- ライブラリの読み込み -->
    <script src="./dist/queryfast.min.js"></script>
    
    <script>
        const { Q } = window.QueryFast;

        // 1. コンポーネントの定義 (v2.0 方式)
        function hero(parent, title, sub) {
            const h = Q(parent).el("sec.hero");
            h.el("hdr.title").text(title);
            h.el("p.sub").text(sub);
            return h;
        }

        function counterComponent(parent) {
            const state = Q.state(0);
            const box = parent.el("div.counter-box");
            
            box.el("spn.count-val").bind(state, v => v, 'text');
            
            box.el("btn.btn-inc")
               .text("Click to Count")
               .on("click", () => state.value++);
            
            return box;
        }

        // 2. 構築
        const app = Q("#app");
        const main = app.el(hero, "QueryFast v2.0", "Minimal / Fastest / Reactive / Light");
        main.el(counterComponent);

    </script>
</body>
</html>

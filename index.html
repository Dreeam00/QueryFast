<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryFast Demo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; max-width: 300px; }
        .active { border-color: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.2); }
    </style>
</head>
<body>
    <h1>QueryFast Static Demo</h1>
    <div id="app"></div>

    <!-- ライブラリの読み込み -->
    <script src="./dist/queryfast.min.js"></script>
    
    <script>
        // 1. リアクティブな状態を作成
        const count = Q.state(0);
        const isHovered = Q.state(false);

        // 2. コンポーネントの定義
        Q.component('Counter', () => {
            const container = Q.add('div.card');
            
            // 状態のバインド（クラス）
            container.bind(isHovered, (active) => ({ active }), 'class');

            // タイトル
            Q.add('h3').content('Counter Component').appendTo(container);

            // カウント表示
            Q.add('p')
                .bind(count, (v) => `Current count: ${v}`, 'text')
                .appendTo(container);

            // ボタン
            Q.add('button')
                .content('Increment')
                .ui({ bg: '#007bff', text: '#fff', border: 'none', padding: '10px', cursor: 'pointer' })
                .on('click', () => count.value++)
                .on('hover', (el, active) => isHovered.value = active)
                .appendTo(container);

            return container;
        });

        // 3. マウント
        Q.mount('Counter', '#app');
    </script>
</body>
</html>

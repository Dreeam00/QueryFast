<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFast | Atomic Web Ecosystem</title>
</head>
<body>

<div id="app"></div>

<!-- Unified bundle -->
<script src="./queryfast.min.js"></script>
<script src="./rootingfast.min.js"></script>
<script src="./fx.min.js"></script>
<script src="./db.min.js"></script>
<script src="./webfast.min.js"></script>

<script>
    const { Q, Router, FX, BaseFast } = window.WebFast;
    const RootingFast = Router;

    // --- Global Styles ---
    Q.global(`
        :root { --p: #0070f3; --bg: #fff; --text: #000; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
        .nav { padding: 20px 40px; display: flex; gap: 20px; border-bottom: 1px solid #eee; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; background: var(--p); color: #fff; cursor: pointer; }
    `);

    // --- UI Components ---
    function Nav(parent) {
        const n = parent.el("nav").set(".nav");
        n.el("a").attr("href", "/").text("HOME");
        n.el("a").attr("href", "/learn").text("LEARN");
        n.el("a").attr("href", "/lab").text("LAB");
    }

    // --- Pages ---
    async function Home(ctx, scp) {
        const app = Q("#app"); app[0].innerHTML = "";
        app.el(Nav);
        app.el("div.container")
            .el("h1").text("Atomic Web Engine")
            .parent.el("p").text("Fast. Simple. No Magic.");
    }

    async function Learn(ctx, scp) {
        const app = Q("#app"); app[0].innerHTML = "";
        app.el(Nav);
        app.el("div.container")
            .el("h1").text("Tutorials")
            .parent.el("p").text("Learn the atomic way, step by step.");
    }

    async function Lab(ctx, scp) {
        const app = Q("#app"); app[0].innerHTML = "";
        app.el(Nav);
        const cont = app.el("div.container");
        cont.el("h1").text("Playground");
        const area = cont.el("textarea").ui({ width: "100%", height: "200px", border: "2px dashed #ccc", margin: "20px 0", padding: "10px" });
        cont.el("btn").text("Render Atomic").set(".btn").on("click", () => {
            area.el("div").text("Atomic Rendered").fx({ opacity: [0, 1] }, 500);
        });
    }

    // --- Routing ---
    document.addEventListener('DOMContentLoaded', () => {
        RootingFast.route({
            "/": Home,
            "/learn": Learn,
            "/lab": Lab
        });
    });
</script>

</body>
</html>
